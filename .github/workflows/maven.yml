name: Build Genetic ChickEngineering

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

permissions:
  contents: write

env:
  STABLE_VERSION: '1.0.1'
  STABLE_JAR: 'SF_GeneticChickEngineering1.0.1.jar'

jobs:
  compatibility-build:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Paper 1.21.11 API floor
            paper: 1.21.11-R0.1-SNAPSHOT
          - name: Paper 26.2 current line
            paper: '[26.2.build.1,26.3)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build compatibility target
        run: mvn -B -ntp -Dpaper.version='${{ matrix.target.paper }}' clean package

  publish-stable-jar:
    name: Publish 1.0.1 release JAR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: compatibility-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build stable JAR from universal baseline
        run: mvn -B -ntp -Drevision='${{ env.STABLE_VERSION }}' -Dpaper.version='1.21.11-R0.1-SNAPSHOT' clean package

      - name: Verify stable JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s "target/${STABLE_JAR}"
          javap -verbose -classpath "target/${STABLE_JAR}" net.guizhanss.gcereborn.GeneticChickengineering | grep -Fq 'major version: 65'
          sha256sum "target/${STABLE_JAR}"

      - name: Publish stable release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${STABLE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the stable release unchanged."
          else
            gh release create "$TAG" "target/${STABLE_JAR}" \
              --target "$GITHUB_SHA" \
              --title "SF Genetic ChickEngineering ${STABLE_VERSION}" \
              --notes "Genetic ChickEngineering 1.0.1 includes the 1.21.11 through 26.2 modernization and the chicken capture/release anti-duplication fixes. Pocket Chickens are consumed only after a successful restore, and failed restoration rolls back the spawned chicken without consuming the item."
          fi

  publish-development-jar:
    name: Publish raw development JAR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: compatibility-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build development JAR
        run: mvn -B -ntp -Drevision=dev -Dpaper.version='[26.2.build.1,26.3)' clean package

      - name: Prepare raw JAR
        shell: bash
        run: |
          cp target/SF_GeneticChickEngineeringdev.jar SF_GeneticChickEngineering-dev.jar
          test -f SF_GeneticChickEngineering-dev.jar

      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view development >/dev/null 2>&1; then
            gh release upload development SF_GeneticChickEngineering-dev.jar --clobber
            gh release edit development \
              --title 'SF Genetic ChickEngineering Development Build' \
              --notes "Latest successful development build from master: ${GITHUB_SHA}"
          else
            gh release create development \
              SF_GeneticChickEngineering-dev.jar \
              --target "$GITHUB_SHA" \
              --title 'SF Genetic ChickEngineering Development Build' \
              --notes "Latest successful development build from master: ${GITHUB_SHA}" \
              --prerelease
          fi

      - name: Add raw JAR download link
        shell: bash
        run: |
          echo '## Raw development JAR' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download SF_GeneticChickEngineering-dev.jar](https://github.com/wickidcow/SF_GeneticChickEngineering/releases/download/development/SF_GeneticChickEngineering-dev.jar)' >> "$GITHUB_STEP_SUMMARY"
