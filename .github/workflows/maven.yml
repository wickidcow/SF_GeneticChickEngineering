name: Build Genetic ChickEngineering

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new versioned release after maintainer approval
        type: boolean
        required: true
        default: false
      version_confirmation:
        description: Exact version to publish (required only when publish is true)
        type: string
        required: false
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

permissions:
  contents: read

env:
  STABLE_VERSION: '1.0.4'
  STABLE_JAR: 'SF_GeneticChickEngineering1.0.4.jar'

jobs:
  compatibility-build:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Paper 1.21.11 API floor
            paper: 1.21.11-R0.1-SNAPSHOT
          - name: Paper 26.2 compatibility
            paper: 26.2.build.112-stable
          - name: Paper 26.3 compatibility
            paper: 26.3.build.211-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test compatibility target
        run: mvn -B -ntp -Dpaper.version='${{ matrix.target.paper }}' clean package

      - name: Test lifecycle artifact verifier controls
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_lifecycle_shim.py'
          python3 -O -m unittest discover -s scripts -p 'test_verify_lifecycle_shim.py'

      - name: Verify lifecycle class ownership and unchanged public API
        run: >-
          python3 scripts/verify_lifecycle_shim.py
          "target/${STABLE_JAR}"
          "$HOME/.m2/repository/net/guizhanss/GuizhanLib-api/1.8.1/GuizhanLib-api-1.8.1.jar"

      - name: Retain tests and compiled compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gce-compatibility-${{ matrix.target.paper }}
          path: |
            target/surefire-reports/
            target/lifecycle-shim-verification.txt
          if-no-files-found: error

      - name: Retain universal candidate JAR
        if: matrix.target.paper == '1.21.11-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v7
        with:
          name: SF_GeneticChickEngineering-candidate
          path: target/${{ env.STABLE_JAR }}
          archive: false
          if-no-files-found: error

  publish-stable-jar:
    name: Publish approved new release JAR
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: compatibility-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require explicit version confirmation and a new release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CONFIRMATION: ${{ inputs.version_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION_CONFIRMATION" = "$STABLE_VERSION"
          test -z "$(git ls-remote --tags origin "refs/tags/v${STABLE_VERSION}")"
          if gh release view "v${STABLE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.' >&2
            exit 1
          fi

      - name: Download verified universal candidate
        uses: actions/download-artifact@v8
        with:
          name: SF_GeneticChickEngineering-candidate
          path: release

      - name: Publish new versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/${STABLE_JAR}"
          gh release create "v${STABLE_VERSION}" "release/${STABLE_JAR}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SF Genetic ChickEngineering ${STABLE_VERSION}" \
            --notes-file docs/releases/1.0.4.md
