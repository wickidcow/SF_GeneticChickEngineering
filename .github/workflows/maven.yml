name: Build Genetic ChickEngineering

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

permissions:
  contents: write

jobs:
  compatibility-build:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Paper 1.21.11 API floor
            paper: 1.21.11-R0.1-SNAPSHOT
          - name: Paper 26.2 current line
            paper: '[26.2.build.1,26.3)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build compatibility target
        run: mvn -B -ntp -Dpaper.version='${{ matrix.target.paper }}' clean package

  publish-development-jar:
    name: Publish raw development JAR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: compatibility-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build development JAR
        run: mvn -B -ntp -Drevision=dev -Dpaper.version='[26.2.build.1,26.3)' clean package

      - name: Prepare raw JAR
        shell: bash
        run: |
          cp target/SF_GeneticChickEngineeringdev.jar SF_GeneticChickEngineering-dev.jar
          test -f SF_GeneticChickEngineering-dev.jar

      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view development >/dev/null 2>&1; then
            gh release upload development SF_GeneticChickEngineering-dev.jar --clobber
            gh release edit development \
              --title 'SF Genetic ChickEngineering Development Build' \
              --notes "Latest successful development build from master: ${GITHUB_SHA}"
          else
            gh release create development \
              SF_GeneticChickEngineering-dev.jar \
              --target "$GITHUB_SHA" \
              --title 'SF Genetic ChickEngineering Development Build' \
              --notes "Latest successful development build from master: ${GITHUB_SHA}" \
              --prerelease
          fi

      - name: Add raw JAR download link
        shell: bash
        run: |
          echo '## Raw development JAR' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download SF_GeneticChickEngineering-dev.jar](https://github.com/wickidcow/SF_GeneticChickEngineering/releases/download/development/SF_GeneticChickEngineering-dev.jar)' >> "$GITHUB_STEP_SUMMARY"
